name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  # auth lists mongodb-memory-server as a dev dependency; CI uses a real Mongo
  # service container instead, so skip the binary download on install.
  MONGOMS_DISABLE_POSTINSTALL: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: OpenAPI documents are valid and committed exports are current
        run: |
          npm run docs:export
          git diff --exit-code -- docs/openapi

  backend-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth
          - user
          - course
          - enrollment
          - quiz
          - payment
          - notification
          - admin
          - certificate
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/eduelderly-${{ matrix.service }}-test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run Jest with coverage
        run: >-
          npm test --workspace=services/${{ matrix.service }} --
          --coverage
          --coverageReporters=lcov --coverageReporters=text-summary
          --collectCoverageFrom='src/**/*.js'
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/${{ matrix.service }}/coverage/lcov.info
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

  client:
    name: Client (test + build)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test --workspace=@eduelderly/client
      - run: npm run build --workspace=@eduelderly/client
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
          retention-days: 7

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [gateway, enrollment]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          build-args: SERVICE_DIR=${{ matrix.service }}
          push: false
          tags: eduelderly-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
