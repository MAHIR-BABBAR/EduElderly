version: 2
updates:
  # One grouped PR a month for npm; majors are upgraded by hand.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # mongoose 9.10+ pulls mongodb driver 7.6.0, which hangs connect() under
      # Jest (Automattic/mongoose#16499). Patch updates only until it is fixed.
      - dependency-name: mongoose
        update-types: [version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    ignore:
      # Stay on the Node LTS line; runtime majors move by hand together with CI.
      - dependency-name: node
        update-types: [version-update:semver-major]
