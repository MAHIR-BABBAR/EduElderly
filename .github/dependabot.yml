version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major bumps are reviewed by hand.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # mongoose 9.10 pulls mongodb driver 7.6.0, whose async runtime-adapter
      # change breaks the handshake under Jest (Automattic/mongoose#16499).
      # Lift this once a driver release fixes it.
      - dependency-name: mongoose
        versions: ['>=9.10.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    ignore:
      # Stay on the LTS line; runtime majors are moved by hand together with CI.
      - dependency-name: node
        update-types: [version-update:semver-major]
